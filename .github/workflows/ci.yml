# Runs the same checks as a local review (lint, unit/component tests, build)
# on every pull request and on pushes to main (#25).
# E2e (Playwright) stays local until Story 4.2, since it needs browsers installed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
